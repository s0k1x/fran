<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Componentes</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#101018;color:#f4f4f8;font-family:Arial,Helvetica,sans-serif}
.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.card{padding:1px;background-image:linear-gradient(163deg,#00ff75 0%,#3700ff 100%);border-radius:20px;overflow:hidden;opacity:0;animation:card-enter .75s cubic-bezier(.2,.75,.25,1) forwards;transition:transform .4s cubic-bezier(.2,.75,.25,1),box-shadow .4s ease;will-change:transform}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}.card:nth-child(4){animation-delay:.21s}.card:nth-child(5){animation-delay:.28s}.card:nth-child(6){animation-delay:.35s}.card:nth-child(7){animation-delay:.42s}.card:nth-child(8){animation-delay:.49s}.card:nth-child(9){animation-delay:.56s}
.card:hover{transform:translateY(-7px);box-shadow:0 12px 34px rgba(0,255,117,.2),0 0 24px rgba(55,0,255,.18)}
.card2{height:230px;margin:1px;background:#1a1a1a;border-radius:19px;overflow:hidden;transition:transform .45s cubic-bezier(.2,.75,.25,1),border-radius .35s ease}
.card2 img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .7s cubic-bezier(.2,.75,.25,1),filter .5s ease}
.card:hover .card2 img{transform:scale(1.055);filter:saturate(1.08)}
h2{font-size:19px;text-align:center;margin:18px 10px;color:#fff;transition:letter-spacing .35s ease,color .35s ease}
.card:hover h2{letter-spacing:.35px;color:#e7fff5}
.rainbow-hover{font-size:16px;font-weight:700;background:#2B3044;border:0;cursor:pointer;padding:12px 24px;line-height:24px;border-radius:9px;box-shadow:0 1px 2px #2B3044,0 4px 16px #2B3044;transition:transform .25s cubic-bezier(.2,.75,.25,1),box-shadow .3s ease;display:flex;justify-content:center;text-decoration:none;margin:0 14px 16px;position:relative;overflow:hidden}
.rainbow-hover::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.12) 48%,transparent 72%);transform:translateX(-120%);transition:transform .65s ease;pointer-events:none}
.rainbow-hover:hover{transform:translateY(-2px);box-shadow:0 5px 18px rgba(134,110,231,.24),0 4px 16px #2B3044}
.rainbow-hover:hover::before{transform:translateX(120%)}
.sp{background:linear-gradient(90deg,#866ee7,#ea60da,#ed8f57,#fbd41d,#2cca91);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent;animation:rainbow-flow 5s linear infinite}
.rainbow-hover:active{transform:scale(.96)}
@keyframes card-enter{from{opacity:0;transform:translateY(22px) scale(.98);filter:blur(4px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes rainbow-flow{to{background-position:200% center}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card2{height:190px}}
@media(max-width:480px){body{padding:14px}.grid{grid-template-columns:1fr}.card2{height:250px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}.card{opacity:1;transform:none;filter:none}}
